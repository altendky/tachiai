name: Setup Android build
description: Install the Android toolchains, restore build caches and fetch this run's route library

inputs:
  save-rust-cache:
    description: Whether this job saves the shared Android Rust cache on main
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - uses: ./.github/actions/setup-rust
      with:
        # Every Android job builds the same core libraries through :core:prepareCore.
        cache-shared-key: android-core
        cache-save: ${{ inputs.save-rust-cache == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}

    - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5
      with:
        cache: true

    - name: Install Android SDK
      uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
      with:
        packages: platform-tools platforms;android-37.2 build-tools;37.0.0 ndk;30.0.16248370

    - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      with:
        # The open-source actions/cache provider, not the proprietary default.
        cache-provider: basic

    - name: Download this run's route library
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: routebridge-${{ github.sha }}
        path: apps/android/routebridge/build
