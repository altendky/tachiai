name: Setup Rust
description: Install the rust-toolchain.toml toolchain and cache Cargo builds

inputs:
  cache-key:
    description: Distinguish caches for jobs that build different targets
    required: false
    default: ""
  cache-shared-key:
    description: Share one cache across jobs that build the same targets
    required: false
    default: ""
  cache-save:
    description: Save the cache; only pushes to main may write it
    required: false
    default: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

runs:
  using: composite
  steps:
    - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
      with:
        # Keep the existing compiler flags and warning policy; this step only
        # installs the pinned toolchain and adds caching.
        build-warnings: ""
        rustflags: ""
        cache-key: ${{ inputs.cache-key }}
        cache-shared-key: ${{ inputs.cache-shared-key }}
        # Repository scripts build into build/core/target, not target/.
        cache-workspaces: ". -> build/core/target"
        # Mise owns installed Cargo tools.
        cache-bin: "false"
        cache-save-if: ${{ inputs.cache-save == 'true' && !startsWith(github.ref, 'refs/tags/') }}
