name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow_ref }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  mise:
    name: Mise / Lockfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5
        with:
          install_args: --locked --dry-run
          cache: false

  repository:
    name: Repository / Pre-commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml', 'mise.toml', 'mise.lock') }}

      - name: Install Rust formatting tools
        run: rustup component add rustfmt

      - run: mise run pre-commit

  routebridge:
    name: Android / Route library
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5
        with:
          cache: true

      - name: Test routebridge on the supported Go minimum
        working-directory: apps/android/routebridge
        env:
          # Dependency artifact updates can raise go.mod even without a Go update PR.
          GOTOOLCHAIN: go1.27.3
          GOWORK: "off"
        run: go test -mod=readonly ./...

      - name: Install Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: platform-tools platforms;android-37.2 build-tools;37.0.0 ndk;30.0.16248370

      - name: Locate Go caches
        id: go-cache
        run: |
          printf 'build=%s\n' "$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
          printf 'modules=%s\n' "$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"

      # Only main writes these caches. The native build scripts fingerprint
      # their inputs, NDK and outputs, and rebuild anything that does not match.
      - name: Restore native transport builds
        id: native-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            apps/android/routebridge/build/openvpn-native
            !apps/android/routebridge/build/openvpn-native/sources
            !apps/android/routebridge/build/openvpn-native/tmp
            !apps/android/routebridge/build/openvpn-native/*/openssl
            !apps/android/routebridge/build/openvpn-native/*/fmt
            !apps/android/routebridge/build/openvpn-native/*/lz4
            apps/android/routebridge/build/openconnect-native
            !apps/android/routebridge/build/openconnect-native/downloads/android-*
          key: routebridge-native-${{ runner.os }}-ndk30.0.16248370-${{ hashFiles('scripts/build-android-openvpn.sh', 'scripts/build-android-openconnect.sh', 'apps/android/openconnect-fixture/**', 'apps/android/routebridge/native/**') }}
          restore-keys: routebridge-native-${{ runner.os }}-ndk30.0.16248370-

      - name: Restore Go build caches
        id: go-cache-restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ${{ steps.go-cache.outputs.build }}
            ${{ steps.go-cache.outputs.modules }}
          key: routebridge-go-${{ runner.os }}-${{ hashFiles('mise.toml', 'mise.lock', 'apps/android/routebridge/go.sum', 'scripts/build-android-routebridge.sh') }}
          restore-keys: routebridge-go-${{ runner.os }}-

      - name: Build and test route transports
        run: |
          sudo apt-get update
          sudo apt-get install --yes cmake ninja-build perl autoconf automake gettext libtool pkg-config
          bash scripts/build-android-routebridge.sh

      - name: Upload route library for this run's Android jobs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: routebridge-${{ github.sha }}
          path: |
            apps/android/routebridge/build/routebridge.aar
            apps/android/routebridge/build/routebridge-native-source.tar.xz
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: Save native transport builds
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.native-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            apps/android/routebridge/build/openvpn-native
            !apps/android/routebridge/build/openvpn-native/sources
            !apps/android/routebridge/build/openvpn-native/tmp
            !apps/android/routebridge/build/openvpn-native/*/openssl
            !apps/android/routebridge/build/openvpn-native/*/fmt
            !apps/android/routebridge/build/openvpn-native/*/lz4
            apps/android/routebridge/build/openconnect-native
            !apps/android/routebridge/build/openconnect-native/downloads/android-*
          key: ${{ steps.native-cache.outputs.cache-primary-key }}

      - name: Save Go build caches
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.go-cache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ${{ steps.go-cache.outputs.build }}
            ${{ steps.go-cache.outputs.modules }}
          key: ${{ steps.go-cache-restore.outputs.cache-primary-key }}

  android-unit:
    name: Android / Unit tests
    needs: routebridge
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-android
        with:
          save-rust-cache: "true"

      # The shared suite runs once, on debug. Inspect reuses debug's code and
      # tests, and release has no tests of its own.
      - working-directory: apps/android
        run: ./gradlew --no-daemon :app:testDebugUnitTest

  android-checks:
    name: Android / Lint and variant tests
    needs: routebridge
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-android

      - name: Lint, compile device tests and run diagnostic-only unit tests
        working-directory: apps/android
        run: |
          # Run only the classes under src/testDiagnostic on the diagnostic
          # variant; the shared suite already runs on debug.
          task_filters=()
          while IFS= read -r -d '' task_file; do
            task_relative="${task_file#app/src/testDiagnostic/kotlin/}"
            task_class="${task_relative%.kt}"
            task_name="${task_class##*/}"
            if ! grep -qE "^(internal |abstract |open )*class ${task_name}\b" "$task_file"; then
              printf '::error file=apps/android/%s::Expected class %s\n' "$task_file" "$task_name"
              exit 1
            fi
            task_filters+=(--tests "${task_class//\//.}")
          done < <(find app/src/testDiagnostic/kotlin -name '*.kt' -print0 | sort -z)
          task_diagnostic=()
          if ((${#task_filters[@]})); then
            task_diagnostic=(:app:testDiagnosticUnitTest "${task_filters[@]}")
          fi
          ./gradlew --no-daemon lint :app:compileDebugAndroidTestKotlin "${task_diagnostic[@]}"

  android-release:
    name: Android / Release build
    needs: routebridge
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-android

      - working-directory: apps/android
        run: ./gradlew --no-daemon :app:verifyReleaseIsolation :app:assembleRelease :core:assembleRelease :core:generatePomFileForReleasePublication :core:sourceReleaseJar

      - name: Upload reusable Android core library and source materials
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: tachiai-core-android-${{ github.sha }}
          path: |
            apps/android/core/build/outputs/aar/core-release.aar
            apps/android/core/build/intermediates/source_jar/release/release-sources.jar
            apps/android/core/build/publications/release/pom-default.xml
            apps/android/core/README.md
            apps/android/routebridge/build/routebridge-native-source.tar.xz
            docs/src/project/shared-rust-core.md
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Checksum unsigned release APK
        working-directory: apps/android
        run: sha256sum app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Upload unsigned release APK and native source companion
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: tachiai-release-unsigned-${{ github.sha }}
          path: |
            apps/android/app/build/outputs/apk/release/app-release-unsigned.apk
            apps/android/routebridge/build/routebridge-native-source.tar.xz
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  android-debug:
    name: Android / Debug APK
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: routebridge
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-android

      - name: Restore Android debug signing key
        env:
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          set +x
          : "${ANDROID_DEBUG_KEYSTORE_BASE64:?Android debug signing secret is missing}"
          umask 077
          mkdir -p "$HOME/.android"
          printf '%s' "$ANDROID_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"

      - name: Build and verify debug APK
        working-directory: apps/android
        run: |
          ./gradlew --no-daemon :app:assembleDebug
          verification="$("$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --print-certs app/build/outputs/apk/debug/app-debug.apk)"
          printf '%s\n' "$verification"
          fingerprints="$(printf '%s\n' "$verification" | sed -n 's/^.*certificate SHA-256 digest: //p' | tr '[:lower:]' '[:upper:]' | sort -u)"
          if [[ "$fingerprints" != 'A258F5F71E7D828F51A3AAF6AA94F97B9DBFBD64E0CE08394A59C120914A7A17' ]]; then
            printf '%s\n' '::error::APK signer does not match the shared Android debug certificate'
            exit 1
          fi
          sha256sum app/build/outputs/apk/debug/app-debug.apk

      - name: Remove Android debug signing key
        if: always()
        run: rm -f "$HOME/.android/debug.keystore"

      - name: Upload debug APK and native source companion
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: tachiai-debug-${{ github.sha }}
          path: |
            apps/android/app/build/outputs/apk/debug/app-debug.apk
            apps/android/routebridge/build/routebridge-native-source.tar.xz
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  core:
    name: Core / Rust and browser bindings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-rust
        with:
          cache-key: core

      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5
        with:
          cache: true

      - name: Check Rust and generated browser bindings
        run: mise run core

      - name: Upload browser package and generated native binding sources
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: tachiai-core-bindings-${{ github.sha }}
          path: |
            build/core/web/
            build/core/bindings/swift/
            build/core/bindings/kotlin/
            build/core/licenses/
            packages/core-web/README.md
            packages/core-web/example.html
            packages/core-ffi/README.md
            docs/src/project/shared-rust-core.md
            LICENSE-MIT
            LICENSE-APACHE
          if-no-files-found: error
          retention-days: 30

  web:
    name: Web / ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - part: harness
            name: Playback harness
          - part: abema
            name: ABEMA fixtures
          - part: providers
            name: Provider and Twitch fixtures
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-rust
        with:
          cache-shared-key: web
          cache-save: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && matrix.part == 'harness' }}

      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5
        with:
          cache: true

      - name: Install fixture packaging prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg xvfb build-essential curl xz-utils unzip

      - name: Install browser test dependencies
        working-directory: apps/web
        run: |
          npm ci --ignore-scripts
          npx playwright install-deps chrome

      - name: Install the verified Chrome 156 local test fixture
        run: |
          # Provider adapter fixtures require the verified Chrome 156 identity.
          # Keep the existing chrome channel; never replace it with moving stable.
          task_browser_root="$RUNNER_TEMP/tachiai-chrome"
          mkdir -p "$task_browser_root"
          curl --disable --fail --location --proto '=https' --proto-redir '=https' \
            --tlsv1.2 --connect-timeout 15 --max-time 180 --retry 2 \
            https://storage.googleapis.com/chrome-for-testing-public/156.0.8078.47/linux64/chrome-linux64.zip \
            --output "$task_browser_root/chrome-linux64.zip"
          printf '%s  %s\n' e6c94490f0b6b337225aeb2d2a5034858516b7017356980ba94f5176d8774a50 \
            "$task_browser_root/chrome-linux64.zip" | sha256sum --check --strict
          unzip -q "$task_browser_root/chrome-linux64.zip" -d "$task_browser_root"
          ln -s chrome "$task_browser_root/chrome-linux64/google-chrome"
          # Keep the executable and its matching resource payload together.
          sudo mkdir -p /opt/google
          if test -e /opt/google/chrome; then
            sudo mv /opt/google/chrome "$task_browser_root/system-chrome"
          fi
          sudo ln -s "$task_browser_root/chrome-linux64" /opt/google/chrome
          printf '%s\n' "$task_browser_root/chrome-linux64" >> "$GITHUB_PATH"
          export PATH="$task_browser_root/chrome-linux64:$PATH"
          test "$(google-chrome --product-version)" = 156.0.8078.47
          test "$(/opt/google/chrome/chrome --product-version)" = 156.0.8078.47

      # The ffmpeg script rejects a prefix whose marker does not match its
      # recipe, so restore only an exact recipe match. Only main writes it.
      - name: Restore owned FFmpeg fixture packager
        id: ffmpeg-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: apps/web/build/tools/ffmpeg-8.1
          key: web-ffmpeg-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/build-web-fixture-ffmpeg.sh') }}

      # The Core job checks the Rust workspace; build only the browser harness here.
      - name: Build the browser harness
        working-directory: apps/web
        run: |
          npm run prepare:assets
          npm run build

      - name: Save owned FFmpeg fixture packager
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && matrix.part == 'harness' && steps.ffmpeg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: apps/web/build/tools/ffmpeg-8.1
          key: ${{ steps.ffmpeg-cache.outputs.cache-primary-key }}

      - name: Test the playback harness
        if: matrix.part == 'harness'
        working-directory: apps/web
        run: npm test

      - name: Test local browser manifest CORS and owned snapshot cleanup
        if: matrix.part == 'abema'
        env:
          TACHIAI_LOCAL_CHROME_TEST: "1"
        run: |
          uv run scripts/tests/web-abema-backend-manifest.test.py
          xvfb-run --auto-servernum uv run scripts/tests/web-abema-browser-snapshot.test.py
          xvfb-run --auto-servernum node --test scripts/tests/web-abema-browser-manifest.test.mjs scripts/tests/web-abema-browser-episode-manifest.test.mjs

      - name: Test local route ownership and proxy-only browser authentication
        if: matrix.part == 'abema'
        env:
          TACHIAI_LOCAL_CHROME_TEST: "1"
        run: |
          uv run scripts/tests/web-abema-route.test.py
          xvfb-run --auto-servernum node --test scripts/tests/web-abema-route-browser.test.mjs

      - name: Test one-exchange browser EME with owned fixtures only
        if: matrix.part == 'abema'
        env:
          TACHIAI_LOCAL_CHROME_TEST: "1"
        run: |
          uv run scripts/tests/web-abema-episode-eme.test.py
          xvfb-run --auto-servernum node --test scripts/tests/web-abema-browser-episode-eme.test.mjs

      - name: Test bounded ABEMA playback with controlled local media only
        if: matrix.part == 'abema'
        env:
          TACHIAI_LOCAL_CHROME_TEST: "1"
        run: |
          uv run scripts/tests/web-abema-backend-playback.test.py
          node --test scripts/tests/web-abema-browser-playback.test.mjs
          npm run test:abema:local --prefix apps/web

      - name: Test one-exchange protected decoding with owned encrypted fixtures only
        if: matrix.part == 'abema'
        env:
          TACHIAI_LOCAL_CHROME_TEST: "1"
        run: |
          node --test scripts/tests/web-encrypted-fixture.test.mjs
          uv run scripts/tests/web-abema-episode-playback.test.py
          xvfb-run --auto-servernum node --test scripts/tests/web-abema-browser-episode-playback.test.mjs
          npm run test:abema:protected --prefix apps/web

      - name: Test the common viewer with owned encrypted DASH and clear HLS
        if: matrix.part == 'providers'
        run: npm run test:owned-mixed --prefix apps/web

      - name: Test provider viewer ownership with synthetic authorization and owned media
        if: matrix.part == 'providers'
        run: |
          npm run test:provider:frame --prefix apps/web
          npm run test:provider:runtime --prefix apps/web
          npm run test:provider:pair --prefix apps/web
          uv run scripts/tests/web-provider-pair-route.test.py
          uv run scripts/tests/web-provider-pair-owner.test.py
          node --test scripts/tests/web-provider-pair-browser.test.mjs

      - name: Test mixed routing and scoped header continuation with owned endpoints
        if: matrix.part == 'abema'
        env:
          TACHIAI_LOCAL_CHROME_TEST: "1"
        run: node --test scripts/tests/web-mixed-route-browser.test.mjs scripts/tests/web-mixed-browser-headers.test.mjs scripts/tests/web-mixed-browser-lifecycle.test.mjs

      - name: Test Twitch media diagnostic boundaries with local fixtures
        if: matrix.part == 'providers'
        run: npm run test:twitch:media --prefix apps/web

      - name: Test paired Twitch ownership with synthetic authorization and owned media
        if: matrix.part == 'providers'
        run: npm run test:twitch:pair --prefix apps/web

  all:
    name: all
    if: ${{ !cancelled() }}
    needs: [mise, repository, routebridge, android-unit, android-checks, android-release, android-debug, core, web]
    runs-on: ubuntu-latest
    steps:
      - uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # release/v1
        with:
          # The debug APK is built only for pushes and manual runs.
          allowed-skips: ${{ github.event_name == 'pull_request' && 'android-debug' || '' }}
          jobs: ${{ toJSON(needs) }}
