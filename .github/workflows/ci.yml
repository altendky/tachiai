name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow_ref }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  mise:
    name: Mise / Lockfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5
        with:
          install_args: --locked --dry-run
          cache: false

  repository:
    name: Repository / Pre-commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml', 'mise.toml', 'mise.lock') }}

      - name: Install Rust formatting tools
        run: rustup component add rustfmt

      - run: mise run pre-commit

  android:
    name: Android / Test, lint and APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5
        with:
          cache: true

      - name: Test routebridge on the supported Go minimum
        working-directory: apps/android/routebridge
        env:
          # Dependency artifact updates can raise go.mod even without a Go update PR.
          GOTOOLCHAIN: go1.26.0
          GOWORK: "off"
        run: go test -mod=readonly ./...

      - name: Install Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: platform-tools platforms;android-37.2 build-tools;37.0.0 ndk;30.0.16248370

      - name: Build shared Rust core and Android bindings
        # Mise selects the pinned toolchain but does not provision manifest targets.
        # Install them explicitly before cross-compiling the reusable library.
        run: |
          rustup target add aarch64-linux-android x86_64-linux-android
          bash scripts/build-android-core.sh

      - name: Build and test route transports
        run: |
          sudo apt-get update
          sudo apt-get install --yes cmake ninja-build perl autoconf automake gettext libtool pkg-config
          bash scripts/build-android-routebridge.sh

      - working-directory: apps/android
        run: ./gradlew --no-daemon test lint :app:compileDebugAndroidTestKotlin :app:verifyReleaseIsolation :app:assembleRelease :core:assembleRelease :core:generatePomFileForReleasePublication :core:sourceReleaseJar

      - name: Upload reusable Android core library and source materials
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: tachiai-core-android-${{ github.sha }}
          path: |
            apps/android/core/build/outputs/aar/core-release.aar
            apps/android/core/build/intermediates/source_jar/release/release-sources.jar
            apps/android/core/build/publications/release/pom-default.xml
            apps/android/core/README.md
            apps/android/routebridge/build/routebridge-native-source.tar.xz
            docs/src/project/shared-rust-core.md
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Checksum unsigned release APK
        working-directory: apps/android
        run: sha256sum app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Upload unsigned release APK and native source companion
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: tachiai-release-unsigned-${{ github.sha }}
          path: |
            apps/android/app/build/outputs/apk/release/app-release-unsigned.apk
            apps/android/routebridge/build/routebridge-native-source.tar.xz
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Restore Android debug signing key
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          set +x
          : "${ANDROID_DEBUG_KEYSTORE_BASE64:?Android debug signing secret is missing}"
          umask 077
          mkdir -p "$HOME/.android"
          printf '%s' "$ANDROID_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"

      - name: Build and verify debug APK
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        working-directory: apps/android
        run: |
          ./gradlew --no-daemon :app:assembleDebug
          verification="$("$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --print-certs app/build/outputs/apk/debug/app-debug.apk)"
          printf '%s\n' "$verification"
          fingerprints="$(printf '%s\n' "$verification" | sed -n 's/^.*certificate SHA-256 digest: //p' | tr '[:lower:]' '[:upper:]' | sort -u)"
          if [[ "$fingerprints" != 'A258F5F71E7D828F51A3AAF6AA94F97B9DBFBD64E0CE08394A59C120914A7A17' ]]; then
            printf '%s\n' '::error::APK signer does not match the shared Android debug certificate'
            exit 1
          fi
          sha256sum app/build/outputs/apk/debug/app-debug.apk

      - name: Remove Android debug signing key
        if: always() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        run: rm -f "$HOME/.android/debug.keystore"

      - name: Upload debug APK and native source companion
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: tachiai-debug-${{ github.sha }}
          path: |
            apps/android/app/build/outputs/apk/debug/app-debug.apk
            apps/android/routebridge/build/routebridge-native-source.tar.xz
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  core:
    name: Core / Rust and browser bindings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5
        with:
          cache: true

      - name: Install Rust check tools and Wasm target
        run: |
          rustup component add rustfmt clippy
          rustup target add wasm32-unknown-unknown

      - name: Check Rust and generated browser bindings
        run: mise run core

      - name: Upload browser package and generated native binding sources
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: tachiai-core-bindings-${{ github.sha }}
          path: |
            build/core/web/
            build/core/bindings/swift/
            build/core/bindings/kotlin/
            build/core/licenses/
            packages/core-web/README.md
            packages/core-web/example.html
            packages/core-ffi/README.md
            docs/src/project/shared-rust-core.md
            LICENSE-MIT
            LICENSE-APACHE
          if-no-files-found: error
          retention-days: 30

  web:
    name: Web / Playback harness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5
        with:
          cache: true

      - name: Install Wasm target and fixture packager
        run: |
          rustup component add rustfmt clippy
          rustup target add wasm32-unknown-unknown
          sudo apt-get update
          sudo apt-get install --yes ffmpeg

      - name: Install browser test dependencies
        working-directory: apps/web
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chrome

      - run: mise run web

  all:
    name: all
    if: ${{ !cancelled() }}
    needs: [mise, repository, android, core, web]
    runs-on: ubuntu-latest
    steps:
      - uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # release/v1
        with:
          jobs: ${{ toJSON(needs) }}
