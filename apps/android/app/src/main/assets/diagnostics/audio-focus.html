<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Single-WebView audio-focus probe</title>
    <style>
      html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        background: #111;
        color: #fff;
        font: 20px sans-serif;
      }
      body {
        box-sizing: border-box;
        display: grid;
        place-content: center;
        gap: 24px;
        padding: 32px;
        text-align: center;
      }
      #controls { display: flex; justify-content: center; gap: 16px; }
      button { min-width: 180px; padding: 20px; font: inherit; }
      #status { white-space: pre-line; }
    </style>
  </head>
  <body>
    <div>Two looping HTML audio elements in one WebView</div>
    <div id="controls">
      <button id="start" type="button">Start both tones</button>
      <button id="stop" type="button">Stop</button>
    </div>
    <div id="status" role="status">Ready</div>
    <script>
      const createToneUrl = (frequency) => {
        const sampleRate = 8000;
        const sampleCount = sampleRate;
        const buffer = new ArrayBuffer(44 + sampleCount * 2);
        const view = new DataView(buffer);
        const writeText = (offset, value) => {
          [...value].forEach((character, index) => {
            view.setUint8(offset + index, character.charCodeAt(0));
          });
        };
        writeText(0, "RIFF");
        view.setUint32(4, 36 + sampleCount * 2, true);
        writeText(8, "WAVEfmt ");
        view.setUint32(16, 16, true);
        view.setUint16(20, 1, true);
        view.setUint16(22, 1, true);
        view.setUint32(24, sampleRate, true);
        view.setUint32(28, sampleRate * 2, true);
        view.setUint16(32, 2, true);
        view.setUint16(34, 16, true);
        writeText(36, "data");
        view.setUint32(40, sampleCount * 2, true);
        for (let sample = 0; sample < sampleCount; sample += 1) {
          const value = Math.sin(2 * Math.PI * frequency * sample / sampleRate);
          view.setInt16(44 + sample * 2, value * 8000, true);
        }
        return URL.createObjectURL(new Blob([buffer], { type: "audio/wav" }));
      };

      const tones = [440, 660].map((frequency) => {
        const audio = new Audio(createToneUrl(frequency));
        audio.loop = true;
        audio.volume = 0.25;
        return audio;
      });
      const status = document.getElementById("status");
      const describe = () => tones.map((tone, index) =>
        `Tone ${index + 1}: ${tone.paused ? "paused" : "playing"}, ` +
          `${tone.currentTime.toFixed(1)} s`
      ).join("\n");
      setInterval(() => { status.textContent = describe(); }, 250);

      document.getElementById("start").addEventListener("click", async () => {
        const results = await Promise.allSettled(tones.map((tone) => tone.play()));
        if (results.some((result) => result.status === "rejected")) {
          status.textContent = "A tone was blocked";
        }
      });
      document.getElementById("stop").addEventListener("click", () => {
        tones.forEach((tone) => tone.pause());
      });
    </script>
  </body>
</html>
