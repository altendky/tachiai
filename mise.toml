[settings]
locked = true
http_timeout = "120s"

[tools]
go = "1.27.2"
java = "temurin-21"
node = "24.21.0"
python = "3.14.10"
rust = "1.98.1"
uv = "0.13.6"
"pipx:pre-commit" = "4.7.0"
"cargo:mdbook" = "0.5.4"
"cargo:wasm-bindgen-cli" = "0.2.129"

[tasks.docs]
description = "Build the project documentation"
run = "mdbook build docs"

[tasks.pre-commit]
description = "Run repository policy and formatting checks"
run = "pre-commit run --all-files --show-diff-on-failure"

[tasks.android]
description = "Test, lint, and assemble the Android feasibility spike"
dir = "apps/android"
run = "bash ../../scripts/build-android-core.sh && bash ../../scripts/build-android-routebridge.sh && ./gradlew --no-daemon test lint :app:compileDebugAndroidTestKotlin :app:verifyReleaseIsolation assembleDebug"

[tasks.core]
description = "Check the reusable Rust core and native/browser bindings"
run = "bash scripts/check-core.sh"

[tasks.core-bindings]
description = "Build the shared native library and generate Kotlin/Swift bindings"
run = "bash scripts/build-core-bindings.sh"

[tasks.web]
description = "Build and test the controlled browser playback harness"
depends = ["core"]
dir = "apps/web"
run = ["npm ci --ignore-scripts", "npm run prepare:assets", "npm run build", "npm test"]

[tasks.check]
description = "Run the local validation suite"
depends = ["pre-commit", "web"]
run = "mise run android"

[tasks.android-emulator-setup]
description = "Create the persistent local development device without replacing existing data"
run = "uv run scripts/android-dev-device.py setup"

[tasks.android-emulator-start]
description = "Start the persistent local development device"
run = "uv run scripts/android-dev-device.py start"

[tasks.android-emulator-stop]
description = "Shut down only the persistent local development device"
run = "uv run scripts/android-dev-device.py stop"

[tasks.android-emulator-status]
description = "Check the persistent local development device identity and boot status"
run = "uv run scripts/android-dev-device.py status"

[tasks.android-emulator-install]
description = "Verify and update the debug APK on the persistent emulator, preserving app data"
run = "uv run scripts/android-dev-device.py install"

[tasks.android-emulator-configure]
description = "Apply the repo's dark-mode and navigation preferences to the owned emulator"
run = "uv run scripts/android-dev-device.py configure"

[tasks.android-tv-setup]
description = "Create the persistent Android TV development device"
run = "uv run scripts/android-dev-device.py --device tv setup"

[tasks.android-tv-start]
description = "Start the visible TV emulator after stopping the phone emulator"
run = "uv run scripts/android-dev-device.py --device tv start"

[tasks.android-tv-stop]
description = "Shut down only the persistent TV emulator"
run = "uv run scripts/android-dev-device.py --device tv stop"

[tasks.android-tv-status]
description = "Verify the persistent TV emulator identity and boot status"
run = "uv run scripts/android-dev-device.py --device tv status"

[tasks.android-tv-install]
description = "Verify and update the debug APK on the TV emulator, preserving data"
run = "uv run scripts/android-dev-device.py --device tv install"
