[settings]
locked = true
http_timeout = "120s"

[tools]
java = "temurin-21"
node = "24.16.0"
python = "3.14.8"
uv = "0.12.23"
"pipx:pre-commit" = "4.6.2"
"cargo:mdbook" = "0.5.4"

[tasks.docs]
description = "Build the project documentation"
run = "mdbook build docs"

[tasks.pre-commit]
description = "Run repository policy and formatting checks"
run = "pre-commit run --all-files --show-diff-on-failure"

[tasks.android]
description = "Test, lint, and assemble the Android feasibility spike"
dir = "apps/android"
run = "./gradlew --no-daemon test lint :app:compileDebugAndroidTestKotlin :app:verifyReleaseIsolation assembleDebug"

[tasks.check]
description = "Run the local validation suite"
depends = ["pre-commit", "android"]
