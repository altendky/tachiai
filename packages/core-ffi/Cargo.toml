[package]
name = "tachiai-core-ffi"
description = "Generated native-language interfaces to Tachiai's portable core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
tachiai-core.workspace = true
# The workspace disables UniFFI defaults; without macro scaffolding the export
# macros emit no symbols or metadata and generated bindings lose this API.
uniffi = { workspace = true, features = ["macro-scaffolding"] }

[lints]
workspace = true
